name: pages

on:
  push:
    branches: [main]
  schedule:
    # Nightly, so the site follows the documentation of phischl/paddock-mdm.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of phischl/paddock-mdm to publish
        required: false
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync documentation from phischl/paddock-mdm
        run: scripts/sync-docs.sh
        env:
          PADDOCK_REF: ${{ inputs.ref || 'main' }}
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
